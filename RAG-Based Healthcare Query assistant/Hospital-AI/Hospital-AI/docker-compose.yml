services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: hospital-ai-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/processed/hospital.db
    volumes:
      - ./data/processed:/app/data/processed
      - ./vector_store:/app/vector_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: hospital-ai-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
